<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorVerse - Offline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex items-center justify-center">
    <div class="text-center px-6 max-w-md">
        <i class="fas fa-wifi text-6xl text-purple-500 mb-6"></i>
        <h1 class="text-3xl font-bold mb-3">You're Offline</h1>
        <p class="text-gray-600 mb-6">
            ColorVerse needs an internet connection to load new coloring pages.
            Reconnect and refresh to continue.
        </p>
        <button onclick="window.location.reload()"
                class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded transition duration-300">
            <i class="fas fa-redo mr-2"></i>Retry Connection
        </button>
    </div>
</body>
</html>
