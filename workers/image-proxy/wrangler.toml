name = "colorverse-image-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGINS = "https://dseeker.github.io"

# API key set as a secret via:
#   npx wrangler secret put POLLINATIONS_API_KEY

[[kv_namespaces]]
binding = "SITE_DATA"
id = "ff1368ad7005423b8e866d7bd8c98ef2"

# Generated image cache. To enable per-image KV caching, create the namespace
# and uncomment the binding (replace the id with the returned value):
#   npx wrangler kv:namespace create IMAGE_CACHE
#   # then paste the returned id below and re-deploy
# The /image route degrades gracefully to edge-cache-only when this binding is
# absent — it still serves images and warms the CF edge cache, just without a
# persistent KV layer across edges.
# [[kv_namespaces]]
# binding = "IMAGE_CACHE"
# id = "..."
