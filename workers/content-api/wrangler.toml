name = "colorverse-content-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGINS = "https://dseeker.github.io"

# API keys are set as secrets via:
#   npx wrangler secret put POLLINATIONS_API_KEY
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put GOOGLE_GEMINI_API_KEY
#   npx wrangler secret put ANALYTICS_SINK        (optional; /events forwards batches here)
#   npx wrangler secret put ANALYTICS_ADMIN_TOKEN (required to read /events/stats;
#                                                   if unset, /events/stats returns 403)

# Analytics aggregate counters. Create the namespace once, then update the
# id below with its output:
#   npx wrangler kv:namespace create ANALYTICS_KV
[[kv_namespaces]]
binding = "ANALYTICS_KV"
id = "REPLACE_WITH_ANALYTICS_KV_NAMESPACE_ID"
