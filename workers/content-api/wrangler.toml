name = "colorverse-content-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGINS = "https://dseeker.github.io,http://localhost:4173,http://127.0.0.1:4173"

# API keys are set as secrets via:
#   npx wrangler secret put POLLINATIONS_API_KEY
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put GOOGLE_GEMINI_API_KEY
#   npx wrangler secret put ANALYTICS_SINK        (optional; /events forwards batches here)
#   npx wrangler secret put ANALYTICS_ADMIN_TOKEN (required to read /events/stats;
#                                                   if unset, /events/stats returns 403)

# Optional kill switch for /catalog (set via `npx wrangler secret put
# DISABLE_WORKER_GEN` or the dashboard): when "true", /catalog serves the
# legacy site-data.json KV key instead of generating. Rollback without
# redeploying.

# Shared site-data KV namespace — the SAME namespace as the image-proxy
# worker. /catalog stores generated catalogs under "catalog:*" keys; the
# legacy "site-data.json" key (used by image-proxy /data and the
# /catalog kill switch) still lives here.
[[kv_namespaces]]
binding = "SITE_DATA"
id = "ff1368ad7005423b8e866d7bd8c98ef2"

# Analytics aggregate counters. To enable the dashboard, create a KV namespace
# and add the binding back (uncomment and fill in the id):
#   npx wrangler kv:namespace create ANALYTICS_KV
#   # then paste the returned id below and re-deploy
# [[kv_namespaces]]
# binding = "ANALYTICS_KV"
# id = "..."
