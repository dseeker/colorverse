<!DOCTYPE html>
<html>
<head>
    <title>Cache Status Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .cache-status { animation: slideIn 0.3s ease-out; }
    </style>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">Cache Status Indicator Test</h1>
        
        <div class="bg-gradient-to-r from-cyan-500 to-blue-500 p-4 rounded-lg shadow-md mb-4">
            <div class="flex items-center justify-between">
                <h2 class="text-white text-xl font-bold">ColorVerse</h2>
                <div id="cache-status" class="cache-status p-2 rounded-lg text-white bg-green-500 bg-opacity-80 flex items-center text-xs">
                    <i class="fas fa-database mr-1"></i>
                    <span id="cache-text">Cached</span>
                </div>
            </div>
        </div>
        
        <div class="space-y-2">
            <button onclick="testLoading()" class="bg-blue-500 text-white px-4 py-2 rounded">Test Loading</button>
            <button onclick="testCached()" class="bg-green-500 text-white px-4 py-2 rounded">Test Cached</button>
            <button onclick="testRefreshing()" class="bg-yellow-500 text-white px-4 py-2 rounded">Test Refreshing</button>
            <button onclick="testHide()" class="bg-gray-500 text-white px-4 py-2 rounded">Test Hide</button>
        </div>
    </div>
    
    <script>
        const indicator = document.getElementById('cache-status');
        const text = document.getElementById('cache-text');
        
        function testLoading() {
            indicator.className = 'cache-status p-2 rounded-lg text-white bg-blue-500 bg-opacity-80 flex items-center text-xs';
            text.textContent = 'Loading...';
        }
        
        function testCached() {
            indicator.className = 'cache-status p-2 rounded-lg text-white bg-green-500 bg-opacity-80 flex items-center text-xs';
            text.textContent = 'Cached';
            setTimeout(() => testHide(), 3000);
        }
        
        function testRefreshing() {
            indicator.className = 'cache-status p-2 rounded-lg text-white bg-yellow-500 bg-opacity-80 flex items-center text-xs';
            text.textContent = 'Updating...';
        }
        
        function testHide() {
            indicator.className = 'cache-status p-2 rounded-lg text-white bg-gray-500 bg-opacity-80 hidden items-center text-xs';
        }
    </script>
</body>
</html>
