name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast gate: lint + unit tests fail in ~2-3 min before the heavy E2E job starts.
  smoke:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run

  test:
    needs: smoke
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run test:e2e
      - run: npm run build:package -- --data-file tests/build/fixtures/site-data.json
      - run: npm run test:e2e:dist
      - run: npm run test:e2e:sw
      - run: npm run test:e2e:sw
        env:
          PLAYWRIGHT_SW_ROOT: dist
