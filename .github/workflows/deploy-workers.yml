name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip if the required secret isn't configured — the deploy will fail anyway,
    # and failing loudly here would block CI on every worker-code push until fixed.
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Deploy image-proxy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/image-proxy
          command: deploy

      - name: Set POLLINATIONS_API_KEY on image-proxy
        workingDirectory: workers/image-proxy
        run: |
          if [ -n "$POLLINATIONS_API_KEY" ]; then
            echo "$POLLINATIONS_API_KEY" | wrangler secret put POLLINATIONS_API_KEY
          else
            echo "POLLINATIONS_API_KEY not set, skipping"
          fi
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy content-api worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/content-api
          command: deploy

      - name: Set POLLINATIONS_API_KEY on content-api
        workingDirectory: workers/content-api
        run: |
          if [ -n "$POLLINATIONS_API_KEY" ]; then
            echo "$POLLINATIONS_API_KEY" | wrangler secret put POLLINATIONS_API_KEY
          else
            echo "POLLINATIONS_API_KEY not set, skipping"
          fi
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set OPENROUTER_API_KEY on content-api
        workingDirectory: workers/content-api
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "$OPENROUTER_API_KEY" | wrangler secret put OPENROUTER_API_KEY
          else
            echo "OPENROUTER_API_KEY not set, skipping"
          fi
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set GOOGLE_GEMINI_API_KEY on content-api
        workingDirectory: workers/content-api
        run: |
          if [ -n "$GOOGLE_GEMINI_API_KEY" ]; then
            echo "$GOOGLE_GEMINI_API_KEY" | wrangler secret put GOOGLE_GEMINI_API_KEY
          else
            echo "GOOGLE_GEMINI_API_KEY not set, skipping"
          fi
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
